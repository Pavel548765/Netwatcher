# =============================================================================
# netwatcher configuration file
# =============================================================================
# This file contains ONLY user-tunable parameters.
# Hard-coded program constants live in /usr/share/netwatcher/data.py.
#
# Permissions: 600, owner: root (may contain secrets).
# No restart required after editing — the file is read at program start.
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────

[paths]
log_dir    = "/var/log/netwatcher"
log_file   = "/var/log/netwatcher/netwatcher.log"
state_file = "/var/log/netwatcher/state.json"


# ─────────────────────────────────────────────────────────────────────────────
# External resources for connectivity checks (step 1 of the algorithm)
# ─────────────────────────────────────────────────────────────────────────────

[checks]
# URLs that must be reachable through the VPN.
urls = [
    "https://example.com/",
    "https://t.me/",    
    "https://youtube.com/",
]

# Target for url-test nodes (currently informational, not used directly).
url_test_target = "https://www.google.com/generate_204"

# ── Direct internet check ───────────────────────────────────────────────────
# Runs BEFORE the tunnel check. If NONE of these succeed — we assume there is
# no internet and exit with FATAL, without touching state or PassWall2.
# OR logic: any single success = internet is up.

direct_ping_host    = "" # Your provider's gateway
direct_ping_timeout = 1
direct_tcping_targets = [
    "5.255.255.242:443",
    "77.88.44.242:443",
    "77.88.55.242:443",
] # Yandex
direct_tcping_timeout = 2

# ── DNS check ───────────────────────────────────────────────────────────────
# Runs AFTER the internet check, BEFORE the tunnel check.
# The current DNS is read from passwall2.@global[0].direct_dns.
# If it doesn't work, the fallbacks below are tried in order; the first
# working one is set as direct_dns (with UCI commit + PassWall2 restart).

dns_check_domain  = "ya.ru"
dns_check_timeout = 5
dns_check_dnssec  = true
dns_fallbacks = [
    "77.88.8.8",       # Yandex DNS
    "77.88.8.1",       # Yandex DNS
    "",   #Your provider's if exists 
]


# ─────────────────────────────────────────────────────────────────────────────
# External utilities
# ─────────────────────────────────────────────────────────────────────────────

[utilities]
tcping = "tcping"
curl   = "curl"
uci    = "uci"
lua    = "lua"
ping   = "ping"
dig    = "dig"


# ─────────────────────────────────────────────────────────────────────────────
# Timeouts (seconds)
# ─────────────────────────────────────────────────────────────────────────────

[timeouts]
tcping    = 5
curl      = 10
net_cmd   = 30
subscribe = 45
restart   = 8


# ─────────────────────────────────────────────────────────────────────────────
# PassWall2 — paths
# ─────────────────────────────────────────────────────────────────────────────

[passwall2]
init          = "/etc/init.d/passwall2"
subscribe_lua = "/usr/share/passwall2/subscribe.lua"


# ─────────────────────────────────────────────────────────────────────────────
# Parallelism
# ─────────────────────────────────────────────────────────────────────────────

[parallelism]
max_workers = 8


# ─────────────────────────────────────────────────────────────────────────────
# Server blacklist
# ─────────────────────────────────────────────────────────────────────────────

[blacklist]
static_addresses = []
threshold    = 3
duration_min = 30


# ─────────────────────────────────────────────────────────────────────────────
# State
# ─────────────────────────────────────────────────────────────────────────────

[state]
history_limit = 100


# ─────────────────────────────────────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────────────────────────────────────

[logging]
level      = 1
file_color = true
